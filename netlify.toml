[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/skincare/"
  to = "/skincare-quiz/"
  status = 301
  force = true

[[redirects]]
  from = "/skincare"
  to = "/skincare-quiz/"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
